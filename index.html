<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grow Believe Change</title>

  <!-- SEO -->
  <meta name="description" content="Grow Believe Change – A place to grow in faith, believe in purpose, and walk in transformation. Coming soon.">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #fbfcfe;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .tagline {
      font-size: 1.2rem;
      margin-bottom: 25px;
      color: #555;
    }

    .coming-soon {
      font-size: 1rem;
      margin-bottom: 30px;
      color: #777;
    }

    .divider {
      width: 60px;
      height: 3px;
      background-color: #9b111e; /* firehouse red (your preference) */
      margin: 20px auto;
      border-radius: 2px;
    }

    .contact {
      font-size: 0.95rem;
      color: #666;
    }

    .contact a {
      color: #9b111e;
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #aaa;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Grow Believe Change</h1>

    <div class="divider"></div>

    <p class="tagline">
      Grow in Faith. Believe in Purpose. Live the Change.
    </p>

    <p class="coming-soon">
      Our website is currently under construction.<br>
      We’re working to bring you something meaningful and impactful.
    </p>

    <div class="contact">
      Want to get in touch?<br>
      <a href="mailto:info@growbelievechange.com">info@growbelievechange.com</a>
    </div>

    <footer>
      © <span id="year"></span> Grow Believe Change
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
